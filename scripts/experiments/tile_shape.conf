# Thi nghiem phu (D5, Duc): tile cua mm_par_2d nen rong bao nhieu? Chay tren may do de chot.
#
#   scripts/run_experiments.sh scripts/experiments/tile_shape.conf
#
# mm_par_2d chia C thanh tile cao b hang, rong w*b cot; moi tile la mot don vi viec (collapse(2)).
# Ben trong tile: for kk { for jj trong be rong tile { block_multiply } } (matmul/mm_par_2d.hpp).
#   --variant simd-w1   tile vuong b x b, dung nhu ma mau trong tai lieu ly thuyet (muc 6.3)
#   --variant simd-w2   tile b x 2b
#   --variant simd-w4   tile b x 4b, mac dinh cua mm_par_2d luc chay thi nghiem nay (commit 01925ff)
#
# DA CHOT (26/11/2026): tile b x b la mac dinh cua mm_par_2d (--variant simd = simd-w1),
# theo ket qua tren may do (docs/ket_qua_tile_shape.md: w4 chi nhanh hon w1 vuot IQR o 2/18 cau hinh).
# Moi w cho ket qua giong tung bit (cot check phai bang nhau, va bang mm_block_seq cung b).
#
# Gia thuyet: voi tile b x b, moi loi goi kernel lien tiep (kk tang) doc b hang MOI cua B,
# cach nhau 8n byte, nen cham b trang nho moi; tile rong hon thi vai loi goi lien tiep (jj tang)
# doc tiep cung b hang do, giong thu tu ii, kk, jj cua mm_block_seq.
#
# Chay thu tren may Duc (i5-12450H, ghim thread, tot nhat 3 lan, may dang nhieu).
# CHI DE KIEM TRA HUONG, KHONG DUA VAO BAO CAO:
#   Do so bo (tot nhat 3 lan): b x b thuong cham hon b x 4b khoang 20-40% o n = 600, 1000, 2000
#   voi 4 va 12 thread; o 1 thread, tile b x b cham hon ca mm_block_seq (tang toc 0,8), b x 4b 1,1.
#   Chay thu file nay 1 lan moi cau hinh (23/11, may dang giam xung): w4 nhanh hon w1 o phan lon
#   cau hinh nhung co cau hinh nguoc lai, nen CHUA DU de ket luan -> can 5 lan tren may do.
#   Ly do "trang nho moi" moi la giai thich, chua do bang bo dem phan cung.
#
# Cach doc ket qua (median t_compute, python scripts/plot_results.py results/raw/tile_shape):
#   - So simd-w1, simd-w2, simd-w4 o cung n, threads, sched.
#   - So mm_par_2d --threads 1 voi mm_block_seq cung n: ban song song chay 1 thread khong nen
#     cham hon ban tuan tu; neu cham hon thi la chi phi cua cach chia tile.
#   - Neu w4 khong nhanh hon w1 ro rang (vuot IQR) tren may do thi quay lai tile b x b cho don
#     gian, dung voi tai lieu ly thuyet. Chot o hop truoc khi chay E5, E6.
#
# b = 48: b tot nhat cua E3 tren may do. Ghim thread (--pin 1) de giam nhieu; 6 thread la moi loi
# vat ly mot thread, 12 thread co dung SMT. So tile (cao 48) voi n = 600, 1000, 2000:
#   w1: 13x13, 21x21, 42x42     w2: 13x7, 21x11, 42x21     w4: 13x4, 21x6, 42x11
# 54 cau hinh mm_par_2d + 3 cau hinh moc mm_block_seq.
# Thoi gian: tren may Duc moi luot 57 lan chay mat khoang 50 s (luot --verify cung vay),
# nen 5 lan chay khoang 5 phut; may do cham hon nen uoc 6-8 phut (gan het o n = 2000, 1 thread).

mm_par_2d --n {600,1000,2000} --b 48 --threads {1,6,12} --schedule {static,dynamic} --pin 1 --variant {simd-w1,simd-w2,simd-w4}

# Moc tuan tu cung b (ghi vao file CSV rieng mm_block_seq.csv).
mm_block_seq --n {600,1000,2000} --b 48
