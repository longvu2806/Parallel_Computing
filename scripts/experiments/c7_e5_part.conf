# C7 / E5: cach phan hoach nao tot hon? 1D theo dai hang (mm_par_1d, Vu), tile b x b (mm_par_2d, Duc),
# Cannon tren luoi q x q (mm_cannon, Duc). Ca ba goi cung kernel block D4, b = 48 (E3), nen khac biet
# chi den tu cach chia viec. Lich static (mac dinh), khong ghim thread (E6, E7 khao sat rieng).
#
# Thi nghiem chinh C7 chay TAT CA file c7_*.conf trong MOT lenh, thu tu cac lan chay xao tron chung,
# de moi so lieu bao cao cung mot phien, cung dieu kien may:
#   scripts/run_experiments.sh scripts/experiments/c7_*.conf
# Truoc khi chay: cam sac, Power mode = Best performance, dong ung dung nen, khong dung may.
#
# Kich thuoc (3 ma tran chiem 24n^2 byte): 600 (8,2 MiB, vua L3), 1000 (22,9 MiB), 2000 (91,6 MiB,
# vuot L3, kich thuoc lon). Cannon can so thread chinh phuong: 1, 4, 9 (9 > 6 loi vat ly nen co SMT).
# Moc T1: mm_block_seq b = 48, cung file nay.

mm_block_seq --n {600,1000,2000} --b 48
mm_par_1d    --n {600,1000,2000} --b 48 --threads {1,2,4,6,12}
mm_par_2d    --n {600,1000,2000} --b 48 --threads {1,2,4,6,12}
mm_cannon    --n {600,1000,2000} --b 48 --threads {1,4,9}

# Phu: 12 thread SMT chia doi L1 cua moi loi, block B chi vua L1 khi b <= 44 (e3_block.conf);
# so b = 32 voi b = 48 o n = 2000.
mm_par_1d    --n 2000 --b 32 --threads {6,12}
mm_par_2d    --n 2000 --b 32 --threads {6,12}
