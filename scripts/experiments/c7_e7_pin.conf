# C7 / E7: ghim thread va dong bo co anh huong khong? n = 2000, b = 48.
#   Ghim thread (--pin 1, common/affinity, Duc) so voi khong ghim, 4 va 6 thread: 1D va tile.
#   Cannon 4 thread (luoi 2 x 2): co barrier giua cac buoc (dung Cannon) so voi khong barrier,
#   co va khong ghim.
# OMP_PROC_BIND khong co tac dung tren MSYS2 nen ghim bang Win32 (tai lieu ly thuyet, muc 8.8).
# Moc T1: mm_block_seq, cung file nay.

mm_block_seq --n 2000 --b 48
mm_par_1d    --n 2000 --b 48 --threads {4,6} --pin {0,1}
mm_par_2d    --n 2000 --b 48 --threads {4,6} --pin {0,1}
mm_cannon    --n 2000 --b 48 --threads 4 --pin {0,1} --variant {barrier,nobarrier}
