# E1: tich vo huong tang toc the nao? dot_seq, dot_omp, co va khong simd.
# BAN NHAP: danh sach cuoi chot o moc M3 (24/11) sau khi chay thu ngan va uoc luong thoi gian.
#
# Kich thuoc chon theo cache cua may do (i7-9850H: L2 256 KiB moi loi, L3 12 MiB dung chung).
# Hai vector double chiem 16n byte:
#   n = 8192        128 KiB  vua L2 cua mot loi
#   n = 262144        4 MiB  vua L3, khong vua L2
#   n = 4194304      64 MiB  vuot L3, doc tu RAM
#   n = 100000000   1,6 GB   kich thuoc lon theo ke hoach (10^8), bi gioi han boi bang thong RAM
# Moc T1 cho speedup: dot_seq --variant simd (ban tuan tu tot nhat, cung muc vectorization).
#
#   scripts/run_experiments.sh scripts/experiments/e1_dot.conf

dot_seq --variant {plain,simd} --n {8192,262144,4194304,100000000}
dot_omp --variant {plain,simd} --n {8192,262144,4194304,100000000} --threads {1,2,4,6,12}
