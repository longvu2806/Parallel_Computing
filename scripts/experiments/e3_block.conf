# E3: block size nao tot nhat? mm_block_seq, 1 thread, quet b.
# BAN NHAP (D3, Duc): danh sach cuoi chot o moc M3 (24/11) sau khi chay thu ngan va uoc luong thoi gian.
# Chay sau khi xong kernel toi uu (D4), vi b tot nhat phu thuoc kernel.
#
#   scripts/run_experiments.sh scripts/experiments/e3_block.conf
#
# --- Cache may do i7-9850H (Coffee Lake, thong so Intel) ---
#   L1d 32 KiB, 8-way, moi loi       L2 256 KiB, 4-way, moi loi
#   L3 12 MiB dung chung             cache line 64 byte = 8 double
#
# --- Du lieu nao phai nam trong cache (kernel ikj trong matmul/mm_kernel.hpp) ---
# Trong mot lan goi block_multiply, voi moi hang i: A[i][k] la mot so, doan hang C[i] chi b double,
# con CA block B (b x b) duoc doc lai tu dau. Block B duoc dung lai b lan (moi hang i mot lan).
# Vay du lieu can giu trong L1 la block B cong hai doan hang: 8b^2 + 16b byte,
# khong phai ca ba block 24b^2 nhu uoc luong tho trong tai lieu ly thuyet (muc 5.3).
#
#   Muc                     Dieu kien                 b toi da
#   B vua L1  (32 KiB)      8b^2 + 16b <= 32 KiB          63
#   3 block vua L1          24b^2 <= 32 KiB               36   (uoc luong tho, qua chat)
#   B vua L2  (256 KiB)     8b^2 <= 256 KiB              181
#   3 block vua L2          24b^2 <= 256 KiB             104
#
# Du doan duong cong thoi gian theo b (dang chu U, co bac thang):
#   b <= 16      cham: vong j qua ngan (<= 4 vector AVX2), ton chi phi vong lap.
#   b ~ 48-64    nhanh nhat: B nam trong L1. b = 64 dung sat bien L1 nen co the da cham lai.
#   b ~ 72-160   bac thang thu hai: B ra khoi L1 nhung con trong L2.
#   b >= 192     cham tiep: B ra khoi L2; b = n la khong chia block (giong mm_seq ikj).
# Vi vay quet day quanh bien L1 (40-72) va bien L2 (128-256).
#
# Chay thu tren may Duc (i5-12450H, P-core: L1d 48 KiB -> bien L1 o b ~ 77, L2 1,25 MiB),
# kernel ban don gian, ghim vao 1 P-core. CHI DE KIEM TRA HINH DANG, KHONG DUA VAO BAO CAO:
#   n = 2000: b=8 8,1 GFLOP/s; b=32 14,7; b=64 16,8 (tot nhat); b=80 11,2 (roi ngay khi B > L1);
#             b=96-256 12,6-13,1; b=512 9,3; b=2000 3,7. Chia block nhanh hon khong chia 4,6 lan.
#   n = 600 va 1000 cung tot nhat o b = 64 va roi o b = 80.
#
# --- Kich thuoc n (3 ma tran double chiem 24n^2 byte) ---
#   n = 600     8,2 MiB   ca A, B, C vua L3: chi thay hieu ung L1/L2
#   n = 1000   22,9 MiB   ca B (7,6 MiB) vua L3, ca ba thi khong
#   n = 2000   91,6 MiB   B (30,5 MiB) vuot L3: moi dai hang cua A doc lai B tu RAM
# Tranh n la luy thua cua 2: hang cach nhau 8n byte; n = 1024 thi 8 KiB, la boi cua 4 KiB
# (dung luong mot way cua L1), nen moi hang cua block B roi vao cung cac set cua L1 va chi giu
# duoc 8 hang (8-way). Tren may Duc, n = 1024 cham hon n = 1000 khoang 1,8 lan o b = 64 du
# chi nhieu hon 7% phep tinh (conflict miss, tai lieu ly thuyet muc 4.3).
#
# --- Dung cho ban song song (E5-E7) ---
# 2 thread SMT tren mot loi dung chung L1, L2: chia doi thi B vua L1 khi b <= 44, vua L2 khi b <= 128.
# Tile nho cung de chia deu: n = 2000, b = 64 co 1024 tile cho 12 thread; b = 256 chi 64 tile.
# Chot b cho ban song song o hop K4 (22/11) sau khi co so lieu E3.
#
# Moi dong co them b = n lam moc khong chia block.
# Thoi gian uoc tinh: khoang 5 phut voi 5 lan chay (gan het o n = 2000).

mm_block_seq --n 600  --b {8,16,24,32,40,48,56,64,72,80,96,128,160,192,256,384,512,600}
mm_block_seq --n 1000 --b {8,16,24,32,40,48,56,64,72,80,96,128,160,192,256,384,512,1000}
mm_block_seq --n 2000 --b {8,16,24,32,40,48,56,64,72,80,96,128,160,192,256,384,512,2000}

# Phu (khong bat buoc, chay nhanh): so voi n = 1000 de thay conflict miss khi n la luy thua cua 2.
mm_block_seq --n 1024 --b {16,32,48,64,96,128,256,1024}
