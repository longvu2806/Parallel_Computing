# C7 / E4: vectorization dong gop bao nhieu? Cung kernel block D4, --variant simd (AVX2, mac dinh)
# hoac novec (#pragma GCC novector, cung ma nhung cam vector hoa). b = 48 (E3).
# 1 thread: mm_block_seq; 6 thread (moi loi vat ly mot thread): mm_par_2d tile b x b.
# Moc T1 cua mm_par_2d novec la mm_block_seq novec (cung muc vectorization), cung file nay.

mm_block_seq --n {600,1000,2000} --b 48 --variant {simd,novec}
mm_par_2d    --n {600,1000,2000} --b 48 --variant {simd,novec} --threads {1,6}
