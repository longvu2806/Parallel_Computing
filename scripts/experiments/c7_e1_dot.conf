# C7 / E1: tich vo huong tang toc the nao? dot_seq, dot_omp, co va khong simd.
# Thi nghiem chinh: chay cung mot lenh voi cac file c7_*.conf khac.
#
# Kich thuoc theo cache may do (i7-9850H: L2 256 KiB moi loi, L3 12 MiB). Hai vector chiem 16n byte:
#   n = 8192        128 KiB  vua L2 cua mot loi
#   n = 262144        4 MiB  vua L3, khong vua L2
#   n = 4194304      64 MiB  vuot L3, doc tu RAM
#   n = 100000000   1,6 GB   kich thuoc lon theo ke hoach (10^8), gioi han boi bang thong RAM
# Moc T1: dot_seq cung muc vectorization (plain so voi plain, simd so voi simd), cung file nay.

dot_seq --variant {plain,simd} --n {8192,262144,4194304,100000000}
dot_omp --variant {plain,simd} --n {8192,262144,4194304,100000000} --threads {1,2,4,6,12}
