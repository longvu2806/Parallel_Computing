# E2: thu tu vong lap anh huong ra sao? mm_seq, 6 thu tu, 1 thread.
# Du doan va ly giai: docs/phan_tich_thu_tu_vong_lap.md (V8, Vu).
#
# Kich thuoc theo goi y cua V8 (3 ma tran double chiem 24n^2 byte), tranh luy thua cua 2
# de khong lan conflict miss vao ket qua:
#   n = 100     234 KiB   ca ba ma tran vua L2 (256 KiB): khac biet chu yeu do phan tinh toan
#   n = 600     8,2 MiB   ca ba vua L3 (12 MiB): miss theo cot o L1 bat dau ton
#   n = 1500   51,5 MiB   B (17 MiB) vuot L3: doc tu RAM, dung mo hinh so miss nhat
#
# Ke hoach du phong cho phep chi chay thu tu cham (jki, kji) o co nho, vua. Chay thu 1 lan tren may
# do (22/11, khong dua vao bao cao): ca 6 thu tu o n = 1500 mat khoang 156 s moi luot
# (kji ~96 s, jki ~33 s), nen giu du 6 thu tu o ca 3 kich thuoc.
# Thoi gian uoc tinh: khoang 16 phut voi 5 lan chay (gan het o n = 1500), ca luot --verify.
#
#   scripts/run_experiments.sh scripts/experiments/e2_loop.conf

mm_seq --variant {ijk,ikj,jik,jki,kij,kji} --n {100,600,1500}
