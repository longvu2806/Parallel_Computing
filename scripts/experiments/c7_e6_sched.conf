# C7 / E6: lap lich anh huong ra sao? 1D va tile, schedule static hoac dynamic, n = 2000 (kich thuoc lon),
# 6 thread (moi loi vat ly mot thread) va 12 thread (co SMT), b = 48. Moc T1: mm_block_seq, cung file nay.
#   1D static: moi thread mot dai hang lien nhau; dynamic: dai cao b hang, thread ranh lay dai tiep theo.
#   tile static: chia danh sach tile thanh doan lien nhau; dynamic: chunk 1 tile.

mm_block_seq --n 2000 --b 48
mm_par_1d    --n 2000 --b 48 --threads {6,12} --schedule {static,dynamic}
mm_par_2d    --n 2000 --b 48 --threads {6,12} --schedule {static,dynamic}
